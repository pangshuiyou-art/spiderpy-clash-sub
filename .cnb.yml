# =============================================================================
# CNB（腾讯云原生构建）流水线：国内机房跑 v2ray 订阅合并 + mihomo 真实测活
#
# 触发方式：
#   1. push 到 main 分支（仅当 .cnb.yml / scripts / config 变更时触发）
#   2. 定时任务：每 6 小时（crontab，时区 Asia/Shanghai）
#
# 额度说明：构建机 8 核，单次实测约 1.22 核时；免费额度 160 核时/月，
#          故定时间隔不宜低于 6 小时（6 小时约 146 核时，占额度 91%）。
#          产物回写只改 data/**，靠 ifModify 拦住，避免构建自我触发翻倍消耗。
#
# 超时策略：CNB 默认「连续 10 分钟无输出」即判超时，而测活阶段本可静默数分钟，
#          实测成功构建的测活阶段约 584s、失败构建恰在 600s 被终止，属贴边抖动。
#          故给「合并订阅并真实测活」这个 Job 声明 timeout：无输出阈值同步放宽到该值，
#          Job 上限也从默认 2h 收到 20m（该阶段实测约 10 分钟，留一倍余量）。
#          测活脚本仍以 python -u 无缓冲输出心跳，双重兜底。
#
# 产物回写：CNB 内置环境变量 CNB_TOKEN 为流水线临时令牌（可推送本仓库代码），
#          无需额外配置密钥；用户名取自内置变量 CNB_TOKEN_USER_NAME（固定 cnb）。
# =============================================================================

# 公共流水线片段：push 与定时任务共用，避免重复定义
.merge-pipeline: &merge-pipeline
  name: merge-v2ray-sub
  # 构建环境：官方完整版 python 镜像自带 git / curl / file，无需 apt 安装
  docker:
    image: python:3.12
  stages:
    - name: 安装 Python 依赖
      script: |
        set -e
        # 多源兜底：清华源曾对构建机返回 403，故改用腾讯云内网源优先
        for PIP_INDEX in \
          "https://mirrors.cloud.tencent.com/pypi/simple/" \
          "https://mirrors.aliyun.com/pypi/simple/" \
          "https://pypi.org/simple/"
        do
          echo "尝试 pip 源: ${PIP_INDEX}"
          if pip install --no-cache-dir -r scripts/v2ray_merger/requirements.txt -i "${PIP_INDEX}"; then
            echo "依赖安装成功（源: ${PIP_INDEX}）"
            break
          fi
          echo "该源不可用，切换下一个"
        done
        python -c "import httpx, yaml; print('依赖导入校验通过')"
    - name: 下载 mihomo 内核
      script: |
        set -e
        MIHOMO_VERSION="v1.19.10"
        MIHOMO_URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
        # 直连 GitHub 失败时依次走国内镜像代理（多源兜底）
        for PREFIX in "" "https://ghfast.top/" "https://gh-proxy.com/"; do
          echo "尝试下载源: ${PREFIX:-GitHub 直连}"
          if curl -sL -f --connect-timeout 15 -o mihomo.gz "${PREFIX}${MIHOMO_URL}"; then
            if file mihomo.gz | grep -q "gzip"; then
              echo "下载成功"
              break
            fi
          fi
          echo "该源不可用，切换下一个"
        done
        file mihomo.gz | grep -q "gzip" || { echo "全部下载源均失败，中止"; exit 1; }
        gunzip -f mihomo.gz || { echo "解压失败"; exit 1; }
        chmod +x mihomo || exit 1
        ./mihomo -v || exit 1
    - name: 合并订阅并真实测活
      # 声明后：无输出超时 10m → 20m，本 Job 上限 2h → 20m
      timeout: 20m
      script: |
        set -e
        # 国内出口存活率低，阈值放宽到 3000ms（测量上限 5000ms，留足余量）
        # -u：关闭 stdout 块缓冲，测活进度心跳才能实时落盘（否则攒在缓冲区里等于没输出）
        python -u scripts/v2ray_merger/merge_v2ray_subs.py --mihomo ./mihomo --max-delay 3000
        python - <<'PY'
        import re
        from pathlib import Path
        text = Path('data/clash/clash_merged.yaml').read_text(encoding='utf-8')
        delays = [int(m) for m in re.findall(r'delay=(\d+)ms', text)]
        print(f"国内视角存活节点数: {len(delays)}")
        if delays:
            delays.sort()
            print(f"延迟 最小/中位/最大: {delays[0]}/{delays[len(delays)//2]}/{delays[-1]} ms")
        PY
    - name: 回写产物到仓库
      script: |
        set -e
        if [ -z "$CNB_TOKEN" ]; then
          echo "未获取到内置 CNB_TOKEN，跳过回写"
          exit 0
        fi
        # 用凭据助手传令牌，避免令牌出现在推送 URL 与日志中
        git config credential.helper '!f() { echo "username=${CNB_TOKEN_USER_NAME}"; echo "password=${CNB_TOKEN}"; }; f'
        git config user.name 'cnb-bot'
        git config user.email 'cnb-bot@cnb.cool'
        git add data/clash/clash_merged.yaml data/clash/v2ray_merged.txt
        git commit -m 'chore: 更新合并代理订阅（国内测活）' || { echo '无变更，跳过提交'; exit 0; }
        git push "https://cnb.cool/${CNB_REPO_SLUG}.git" HEAD:main

main:
  push:
    # ifModify：仅当代码/配置变更时才执行，产物回写（只改 data/**）不再触发新构建；
    # 定时任务与页面手动触发都会忽略该检查，不受影响
    - ifModify:
        - .cnb.yml
        - scripts/**
        - config/**
      <<: *merge-pipeline
  "crontab: 0 */6 * * *":
    - <<: *merge-pipeline
