name: IP 探测 v2（token 长度差异深挖）

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ip-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 实验 A——裸请求（无 Referer/Origin/UA）
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/a$i.json -w '%{http_code}' --max-time 30 \
              -X POST 'https://login.microsoftonline.com/9188040d-6c67-4c5b-b112-36a304b66dad/api/v1.0/risk/initialize' \
              -H 'Content-Type: application/json' \
              -d '{"continuationToken":""}' || echo FAIL)
            LEN=$(python3 -c "import json;print(len(json.load(open('/tmp/a$i.json')).get('continuationToken','')))" 2>/dev/null || echo ERR)
            echo "裸请求#$i: HTTP=$CODE token长度=$LEN"
            sleep 2
          done

      - name: 实验 B——完整头（模拟真实浏览器）
        run: |
          CODE=$(curl -s -o /tmp/b.json -w '%{http_code}' --max-time 30 \
            -X POST 'https://login.microsoftonline.com/9188040d-6c67-4c5b-b112-36a304b66dad/api/v1.0/risk/initialize' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -H 'Accept: application/json' \
            -H 'Origin: https://signup.live.com' \
            -H 'Referer: https://signup.live.com/' \
            -H 'hpgid: 200225' \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0.0.0 Safari/537.36' \
            -d '{"continuationToken":""}' || echo FAIL)
          LEN=$(python3 -c "import json;print(len(json.load(open('/tmp/b.json')).get('continuationToken','')))" 2>/dev/null || echo ERR)
          echo "完整头: HTTP=$CODE token长度=$LEN"

      - name: 实验 C——先访问 signup 页（拿 cookie）
        run: |
          curl -s -c /tmp/ck.txt -o /dev/null --max-time 30 'https://signup.live.com/signup?lic=1&mkt=en-US' || true
          echo "cookie 行数: $(wc -l < /tmp/ck.txt)"
          CODE=$(curl -s -b /tmp/ck.txt -o /tmp/c.json -w '%{http_code}' --max-time 30 \
            -X POST 'https://login.microsoftonline.com/9188040d-6c67-4c5b-b112-36a304b66dad/api/v1.0/risk/initialize' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -H 'Accept: application/json' \
            -H 'Origin: https://signup.live.com' \
            -H 'Referer: https://signup.live.com/' \
            -H 'hpgid: 200225' \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0.0.0 Safari/537.36' \
            -d '{"continuationToken":""}' || echo FAIL)
          LEN=$(python3 -c "import json;print(len(json.load(open('/tmp/c.json')).get('continuationToken','')))" 2>/dev/null || echo ERR)
          echo "带cookie: HTTP=$CODE token长度=$LEN"

      - name: 实验 D——token 明文头对比
        run: |
          python3 -c "
          import json, base64, os
          for name in ['a1','a2','a3','b','c']:
              p = f'/tmp/{name}.json'
              if not os.path.exists(p): continue
              try:
                  d = json.load(open(p))
                  t = d.get('continuationToken','')
                  raw = base64.urlsafe_b64decode(t + '=' * (-len(t) % 4))
                  print(f'{name}: token={len(t)} 解码={len(raw)}字节')
                  print(f'  头45: {raw[:45].hex()}')
                  print(f'  文本: {raw[:45]!r}')
              except Exception as e:
                  print(f'{name}: {e}')
          "

      - name: 实验 E——★ 用 GitHub IP 跑完整流程（看能否拿到不同结果）
        run: |
          echo "=== 用完整头 + cookie 跑 verify ==="
          python3 -c "
          import json
          tok = json.load(open('/tmp/c.json')).get('continuationToken','')
          body = {
            'continuationToken': tok,
            'riskProviderMetadata': [{
              'riskProvider': 'Human',
              'px3': '0'*64 + ':' + 'A'*88 + ':1000:' + 'A'*80,
              'pxde': '0'*64 + ':eyJ0aW1lc3RhbXAiOjB9',
              'pxvid': '00000000-0000-0000-0000-000000000000',
            }],
            'msaRiskVerifySignature': {
              'memberName': 'ghprobe2@outlook.com',
              'siteId': '', 'uiFlavor': 'Web', 'appId': '',
              'birthdate': '01:01:1990', 'firstName': 'James', 'lastName': 'Smith',
              'countryCode': 'US', 'verificationCode': '',
              'deviceDetails': {'isRdm': False}, 'action': 'SignUp',
            },
          }
          open('/tmp/v.json','w').write(json.dumps(body))
          print('已构造')
          "
          CODE=$(curl -s -b /tmp/ck.txt -o /tmp/vr.json -w '%{http_code}' --max-time 30 \
            -X POST 'https://login.microsoftonline.com/9188040d-6c67-4c5b-b112-36a304b66dad/api/v1.0/risk/verify' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -H 'Accept: application/json' \
            -H 'Origin: https://signup.live.com' \
            -H 'Referer: https://signup.live.com/' \
            -H 'hpgid: 200225' \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0.0.0 Safari/537.36' \
            -d @/tmp/v.json || echo FAIL)
          echo "verify: HTTP=$CODE"
          head -c 400 /tmp/vr.json
          echo ""
          if grep -q riskChallengeRequired /tmp/vr.json; then echo '★★★★★ 能弹挑战！'; fi
          if grep -q riskBlock /tmp/vr.json; then echo '❌ riskBlock'; fi
