name: 更新Thordata订阅

on:
  workflow_dispatch:
  schedule:
    # 源自身每 6 小时刷新一次，这里跟随同频抓取
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install pyyaml httpx

      - name: 生成分组订阅
        run: python scripts/thordata_build.py

      - name: 提交更新
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/thordata/residential.yaml data/thordata/daily.yaml
          git commit -m 'chore: 更新 Thordata 分组订阅' || echo '无变更，跳过提交'
          git push