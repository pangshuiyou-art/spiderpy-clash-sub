name: 更新v2ray合并订阅

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时自动跑（60 天无提交会静默停用，失效时手动 Run 一次）

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r scripts/v2ray_merger/requirements.txt

      - name: 下载 mihomo 内核（真实测活用）
        run: |
          # 固定版本号（已验证可用），避免未认证 API 动态取版本被限流导致 URL 404
          MIHOMO_VERSION="v1.19.10"
          echo "mihomo 版本: $MIHOMO_VERSION"
          curl -sL -f -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz" \
            || { echo "下载失败"; exit 1; }
          # 校验 gzip 头（1f 8b），404 页面 / 截断文件都会在此暴露
          file mihomo.gz | grep -q "gzip compressed" || { echo "下载内容非 gzip，中止"; exit 1; }
          gunzip -f mihomo.gz || { echo "解压失败"; exit 1; }
          chmod +x mihomo || exit 1
          ./mihomo -v || exit 1

      - name: 合并订阅并真实测活
        run: python scripts/v2ray_merger/merge_v2ray_subs.py --mihomo ./mihomo

      - name: 提交更新产物
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/clash/clash_merged.yaml data/clash/v2ray_merged.txt
          git commit -m 'chore: 更新合并代理订阅' || echo '无变更，跳过提交'
          git push