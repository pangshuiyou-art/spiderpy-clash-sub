name: 更新v2ray合并订阅

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时自动跑（60 天无提交会静默停用，失效时手动 Run 一次）

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r scripts/v2ray_merger/requirements.txt

      - name: 下载 mihomo 内核（真实测活用）
        run: |
          # 取最新 release 的 linux-amd64 版本号（避免版本写死失效）
          LATEST=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep -oP '"tag_name":\s*"\K[^"]+')
          echo "mihomo 版本: $LATEST"
          curl -sL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${LATEST}/mihomo-linux-amd64-${LATEST}.gz"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: 合并订阅并真实测活
        run: python scripts/v2ray_merger/merge_v2ray_subs.py --mihomo ./mihomo

      - name: 提交更新产物
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/clash/clash_merged.yaml data/clash/v2ray_merged.txt
          git commit -m 'chore: 更新合并代理订阅' || echo '无变更，跳过提交'
          git push