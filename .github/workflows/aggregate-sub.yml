name: 更新聚合订阅

# 聚合层：8 个代理池源 + 2 个订阅链接源 + 1 个数据中心 CIDR 段库
#        → 去重 → 剔除扫描噪音 → 源侧粗筛 → TCP 预筛 → ip-api 补元数据
#        → 住宅分类（CIDR 段库 + hosting + ASN 白名单，含放宽策略）
#        → mihomo 多轮测活（住宅 3 轮 / 日常 2 轮）→ 命名 → 产物校验
#
# 产物直接落在 data/free_proxy/：整合后住宅组/日常组只由本线产出，客户端既有链接
# 无需改动。CNB 只运行影子流水线，结果写 data/cnb_shadow/，不覆盖正式订阅。

on:
  workflow_dispatch:
  schedule:
    # 沿用原免费代理线的频率与时段，避免改变产出新鲜度；刻意避开整点以降低 schedule 被丢弃的概率。
    - cron: '43 3,9,15,21 * * *'

permissions:
  contents: write

concurrency:
  group: aggregate-sub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r scripts/sub_aggregator/requirements.txt

      - name: 下载 mihomo 内核
        run: |
          set -e
          # 固定版本避免未认证 API 限流导致 404（本项目既有教训）
          MIHOMO_VERSION="v1.19.10"
          MIHOMO_URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          curl -sL -f --retry 3 --connect-timeout 20 -o mihomo.gz "${MIHOMO_URL}"
          # 下载后校验确实是 gzip，防止拿到错误页
          file mihomo.gz | grep -q gzip
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: 聚合并测活
        run: |
          set -e
          python scripts/sub_aggregator/build_aggregated_subs.py \
            --mihomo ./mihomo \
            --residential-rounds 3 \
            --daily-rounds 2 \
            --max-residential-test 1500 \
            --max-daily-test 4000

      - name: 产物自检（节点数与策略组）
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          import yaml

          for name in ('residential', 'daily'):
              path = Path(f'data/free_proxy/{name}.yaml')
              if not path.exists():
                  print(f'[!] {name}: 产物不存在')
                  continue
              data = yaml.safe_load(path.read_text(encoding='utf-8'))
              proxies = data.get('proxies') or []
              groups = data.get('proxy-groups') or []
              print(f'[OK] {name}: {len(proxies)} 节点 / {len(groups)} 策略组')
              if not proxies:
                  raise SystemExit(f'{name} 节点数为 0，判定失败')
              if not groups:
                  raise SystemExit(f'{name} 策略组为空，判定失败')

          # socks4 是纯文本清单（非 Clash 配置），只校验端点格式
          socks4 = Path('data/free_proxy/residential-socks4.yaml')
          if not socks4.exists():
              print('[!] residential-socks4: 产物不存在（本轮无 socks4 存活属正常）')
          else:
              body = [line.split('#', 1)[0].strip() for line in
                      socks4.read_text(encoding='utf-8').splitlines()]
              endpoints = [line for line in body if line and not line.startswith('#')]
              print(f'[OK] residential-socks4: {len(endpoints)} 端点')
              for line in endpoints:
                  host, _, port = line.rpartition(':')
                  if not host or not port.isdigit():
                      raise SystemExit(f'residential-socks4 端点非法: {line}')
          PY

      - name: 提交产物
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # 只提交订阅产物与白名单；候选 CSV 是人工审查用的中间产物，不入库。
          # 脚本在对应组存活数为 0 时不写文件，故逐个判断存在性，避免 git add 路径不匹配而失败。
          git add config/residential_asns.yaml
          for name in residential daily residential-socks4; do
            path="data/free_proxy/${name}.yaml"
            if [ -f "$path" ]; then
              git add "$path"
            else
              echo "[!] $path 不存在，跳过提交"
            fi
          done
          # 两组都为空时 git add 无事可做，直接结束
          if git diff --cached --quiet; then
            echo '无变更，跳过提交'
            exit 0
          fi
          git commit -m 'chore: 更新聚合分组订阅'
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push

      - name: 刷新 jsdelivr 缓存
        run: |
          # 产物走 jsdelivr 分发，主动 purge 才能让国内订阅及时更新（本项目既有做法）
          for name in residential daily residential-socks4; do
            curl -s --max-time 20 \
              "https://purge.jsdelivr.net/gh/pangshuiyou-art/spiderpy-clash-sub@main/data/free_proxy/${name}.yaml" \
              || true
          done
