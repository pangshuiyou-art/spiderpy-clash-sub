# =============================================================================
# 订阅聚合源清单：聚合层唯一的源配置入口
#
# 新增一个源只需在本文件追加一项，不用改代码。
# 每个源必须声明 kind：
#   kind: proxypool   ip:port 型代理池（参与住宅判定，进「住宅组 / 日常组」）
#                     format 支持 csv / json / plain；plain 用 protocol 指定固定协议
#   kind: link        订阅链接型（base64 / 明文链接 / Clash YAML / v2rayN JSON 自动识别）
#                     只进「日常组」——链接节点的 server 多是中转入口，不能按 IP 判住宅
#
# proxypool 的 fields 用点号表示嵌套（如 asn.autonomous_system_organization）；
# 有元数据的源走源侧粗筛，无元数据的源靠 TCP 预筛降量。
# 代理池源与链接源统一在本文件维护，聚合流水线只读取这一份源清单。
# =============================================================================

sources:
  # ===== 代理池：有元数据（元数据会沿同 IP 传播给其它源）=====
  - name: proxyscrape_all
    kind: proxypool
    url: https://raw.githubusercontent.com/ProxyScrape/free-proxy-list/main/proxies/all/data.csv
    format: csv
    enabled: true
    fields:
      ip: ip
      port: port
      protocol: protocol
      country_code: country_code
      country: country
      city: city
      anonymity: anonymity
      uptime: uptime_percent
      asn: asn
      isp: isp
      latency_ms: latency_ms

  - name: monosans
    kind: proxypool
    url: https://raw.githubusercontent.com/monosans/proxy-list/main/proxies.json
    format: json
    enabled: true
    fields:
      ip: host
      port: port
      protocol: protocol
      country_code: geolocation.country.iso_code
      city: geolocation.city.names.en
      asn: asn.autonomous_system_number
      isp: asn.autonomous_system_organization
      # 源里 timeout 单位为秒，代码内转毫秒
      latency_s: timeout

  - name: proxmint
    kind: proxypool
    url: https://raw.githubusercontent.com/proxmint/free-proxy-list/main/proxies/all.json
    format: json
    enabled: true
    fields:
      ip: ip
      port: port
      protocol: protocol
      country_code: country
      country: countryName
      anonymity: anonymity
      latency_ms: latencyMs
      uptime: uptimePct
      score: score

  - name: thordata
    kind: proxypool
    url: https://raw.githubusercontent.com/Thordata/awesome-free-proxy-list/main/proxies/all.csv
    format: csv
    enabled: true
    fields:
      ip: ip
      port: port
      protocol: type
      country_code: country_code
      country: country
      latency_ms: latency_ms
      anonymity: anonymity
      streak: streak
      asn: asn
      isp: asn_org
      # 源方维护的 IP 类型（residential / datacenter）被直接采信，是住宅判定的第一层
      ip_type: ip_type

  - name: proxyfree_all
    kind: proxypool
    url: https://raw.githubusercontent.com/proxy-free/free-proxy-list/main/proxies.json
    format: json
    enabled: true
    fields:
      ip: ip
      port: port
      protocol: protocol
      country_code: country_code
      country: country
      anonymity: anonymity
      uptime: uptime

  # ===== 代理池：无元数据（量大，靠 TCP 预筛降量）=====
  - name: speedx_http
    kind: proxypool
    url: https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt
    format: plain
    protocol: http
    enabled: true

  - name: speedx_socks5
    kind: proxypool
    url: https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt
    format: plain
    protocol: socks5
    enabled: true

  - name: hookzof_socks5
    kind: proxypool
    url: https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt
    format: plain
    protocol: socks5
    enabled: true

  # ===== 订阅链接（只进「日常组」）=====
  - name: daily_free_vpn
    kind: link
    url: https://raw.githubusercontent.com/cbusifabcap/daily_free_vpn/refs/heads/main/sub/V2Ray.yml
    enabled: true

  - name: free_v2ray_configs
    kind: link
    url: https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/verified/configs_base64.txt
    enabled: true

  # ===== 预留接口示例（默认关闭，需要时把 enabled 改成 true）=====
  # - name: 你的源名字
  #   kind: link            # 或 proxypool
  #   url: https://example.com/sub.txt
  #   enabled: false

# ===== 辅助数据（不产出节点，仅用于住宅识别）=====
auxiliary:
  # 数据中心 IP 段库：用于排除法剔除非住宅（每次运行拉取最新）
  - name: x4bnet_datacenter
    url: https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/datacenter/ipv4.txt
    type: cidr_blacklist
    enabled: true

# ===== 住宅判定放宽策略（用户要求：住宅组可以放宽一些）=====
residential_policy:
  # 移动网络按住宅处理：运营商 IP 常被 ip-api 标成 hosting，是住宅召回的主要漏点
  mobile_as_residential: true
  # 2026-10-11 关闭：ip-api 全量补查上线后，无结论只代表查询失败/未覆盖，
  # 此时有 ASN 也当住宅的误判率实测 19%（59 样本 8 个机房），unknown 一律归日常组
  unknown_with_asn_as_residential: false
  # 上述放宽不适用于本轮被 ip-api 明确判为机房的 ASN
  exclude_datacenter_asns: true
