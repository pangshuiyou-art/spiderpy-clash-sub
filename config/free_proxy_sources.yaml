# 免费代理源配置：新增源只需追加一项，无需改代码
#
# 字段说明：
#   name       源标识（用于日志与元数据溯源）
#   url        数据地址
#   format     csv / json / plain（plain 为 ip:port 或 scheme://ip:port 每行一条）
#   protocol   仅 plain 格式需要：该源固定协议（http / socks5）
#   default_protocol  仅 plain 格式需要：无 scheme 前缀时按此协议处理
#   fields     字段映射（点号表示嵌套，如 asn.autonomous_system_organization）
#   enabled    是否启用
#
# 有元数据的源用字段映射提取 isp/asn/latency/uptime；无元数据的源走 TCP 预筛 + ASN 查询补全
sources:
  # ===== 有元数据（优先可信，元数据会传播给其他源的同 IP 条目）=====
  - name: proxyscrape_all
    url: https://raw.githubusercontent.com/ProxyScrape/free-proxy-list/main/proxies/all/data.csv
    format: csv
    enabled: true
    fields:
      ip: ip
      port: port
      protocol: protocol
      country_code: country_code
      country: country
      city: city
      anonymity: anonymity
      uptime: uptime_percent
      asn: asn
      isp: isp
      latency_ms: latency_ms

  - name: monosans
    url: https://raw.githubusercontent.com/monosans/proxy-list/main/proxies.json
    format: json
    enabled: true
    fields:
      ip: host
      port: port
      protocol: protocol
      country_code: geolocation.country.iso_code
      city: geolocation.city.names.en
      asn: asn.autonomous_system_number
      isp: asn.autonomous_system_organization
      # timeout 单位为秒，转毫秒在代码内处理
      latency_s: timeout
      exit_ip: exit_ip

  - name: proxmint
    url: https://raw.githubusercontent.com/proxmint/free-proxy-list/main/proxies/all.json
    format: json
    enabled: true
    fields:
      ip: ip
      port: port
      protocol: protocol
      country_code: country
      country: countryName
      anonymity: anonymity
      latency_ms: latencyMs
      uptime: uptimePct
      score: score

  - name: thordata
    url: https://raw.githubusercontent.com/Thordata/awesome-free-proxy-list/main/proxies/all.csv
    format: csv
    enabled: true
    fields:
      ip: ip
      port: port
      protocol: type
      country_code: country_code
      country: country
      latency_ms: latency_ms
      anonymity: anonymity
      streak: streak
      asn: asn
      isp: asn_org
      ip_type: ip_type

  # ===== 无元数据（量大，靠 TCP 预筛降量）=====
  - name: speedx_http
    url: https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt
    format: plain
    protocol: http
    enabled: true

  - name: speedx_socks5
    url: https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt
    format: plain
    protocol: socks5
    enabled: true

  - name: hookzof_socks5
    url: https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt
    format: plain
    protocol: socks5
    enabled: true

  - name: proxyfree_all
    url: https://raw.githubusercontent.com/proxy-free/free-proxy-list/main/proxies.json
    format: json
    enabled: true
    fields:
      ip: ip
      port: port
      protocol: protocol
      country_code: country_code
      country: country
      anonymity: anonymity
      uptime: uptime

# ===== 辅助数据（不产出节点，用于住宅识别）=====
auxiliary:
  # 数据中心 IP 段库：用于排除法剔除非住宅（每次运行拉取最新）
  - name: x4bnet_datacenter
    url: https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/datacenter/ipv4.txt
    type: cidr_blacklist
    enabled: true
